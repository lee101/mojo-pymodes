[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mojo-pymodes"
version = "0.1.0"
description = "pyModeS's ADS-B decoding primitives, in Mojo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy", "pymodes==3.6.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["python/mojopymodes"]
